#
# Destination: target-cpi
#
# Upload via: BTP Cockpit → Subaccount → Connectivity → Destinations → Import
#
# PURPOSE: OAuth2UserTokenExchange — exchanges the IAS JWT (x-identity-token)
# for a target-subaccount XSUAA token scoped to the named user.
# The CAP backend passes the IAS JWT as jwt: iasToken to getDestination().
#
# FILL IN before uploading:
#   <TARGET_CPI_HOST>   → url field from the CPI Process Integration Runtime service key
#                         e.g. https://abc123.it-cpi020-rt.cfapps.eu10-004.hana.ondemand.com
#   <TOKEN_URL>         → tokenurl field from the service key  (without /oauth/token suffix)
#                         e.g. https://mysubdomain.authentication.eu10.hana.ondemand.com
#   <CLIENT_ID>         → clientid from the service key
#   <CLIENT_SECRET>     → clientsecret from the service key
#
Name=target-cpi
Type=HTTP
URL=<TARGET_CPI_HOST>
Authentication=OAuth2UserTokenExchange
tokenServiceURLType=Dedicated
tokenServiceURL=<TOKEN_URL>/oauth/token
clientId=<CLIENT_ID>
clientSecret=<CLIENT_SECRET>
Description=CPI API — OAuth2UserTokenExchange for named-user principal propagation
# ProxyType default is Internet — no need to set it
# Do NOT add token-type=ias — that switches to client_credentials flow, breaks user exchange
